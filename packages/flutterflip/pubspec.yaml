name: flutterflip
description: A Reversi game built with Flutter.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  async: ^2.13.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  http: ^1.2.1
  flutterflip_shared:
    path: ../flutterflip_shared

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
        - asset: assets/fonts/Roboto-ThinItalic.ttf
          style: italic
