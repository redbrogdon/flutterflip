name: flutterflip_server
description: Pure Dart server package for FlutterFlip running on Firebase Cloud Functions.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  firebase_functions: ^0.5.0
  shelf: ^1.4.1
  flutterflip_shared:
    path: ../flutterflip_shared

dev_dependencies:
  # Required for firebase_functions
  build_runner: ^2.4.8
